<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - IndustryEase</title>

    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body data-page="register">

    <!-- Navbar -->

    <header>
        <nav class="navbar">

            <div class="logo">
                IndustryEase
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>

        </nav>
    </header>


    <!-- Register Section -->

    <main>

        <section class="register-section">

            <div class="register-box">

                <h1>
                    Create Your
                    <span>IndustryEase Account</span>
                </h1>

                <p>
                    Register to manage your industrial approvals and compliance.
                </p>


                <!-- Registration Form -->

                <form id="registerForm">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >


                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>
        <p>© 2026 IndustryEase. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
